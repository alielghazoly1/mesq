  function tick() {
    var ms = START - Date.now();
    // يوم الفرح جه: العدّاد يتبدّل بجملة (في المحرر الاتنين ظاهرين عشان يتعدّلوا)
    var over = ms <= 0 && !EDIT;
    if (cdBox.classList.contains('gone') !== over) { cdBox.classList.toggle('gone', over); cdDone.classList.toggle('on', over); }
    ms = Math.max(0, ms);
    var v = [Math.floor(ms / 864e5), Math.floor(ms / 36e5 % 24), Math.floor(ms / 6e4 % 60), Math.floor(ms / 1e3 % 60)];
    for (var i = 0; i < 4; i++) { var t = dg(pad2(v[i])); if (cdEls[i].textContent !== t) cdEls[i].textContent = t; }
  }
  tick(); setInterval(tick, 1000);

  /* ---------- الصور: الكارت اللي في النص ظاهر كامل، والنقط والأسهم بتتحرك معاه + عرض الصورة كبيرة ---------- */
  (function () {
    var tr = $('#gtrack'); if (!tr) return;
    var items = $$('.gitem', tr), dots = $('#gdots');
    var prev = $('#gal .garr.p'), next = $('#gal .garr.n'), cur = -1;
    items.forEach(function (it, i) {
      var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Photo ' + (i + 1));
      b.addEventListener('click', function () { go(i); }); dots.appendChild(b);
      it.addEventListener('click', function () { if (EDIT) return; if (i === cur) openLb(i); else go(i); });
    });
    function setCur(i) {
      if (i === cur) return; cur = i;
      items.forEach(function (it, k) { it.classList.toggle('on', k === i); });
      [].forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k === i); });
      prev.disabled = i === 0; next.disabled = i === items.length - 1;
    }
    function go(i) {
      i = Math.max(0, Math.min(items.length - 1, i));
      var it = items[i];
      tr.scrollTo({ left: it.offsetLeft - (tr.clientWidth - it.offsetWidth) / 2, behavior: 'smooth' });
      setCur(i);
    }
    var raf = 0;
    tr.addEventListener('scroll', function () {
      if (raf) return;
      raf = requestAnimationFrame(function () {
        raf = 0;
        var mid = tr.scrollLeft + tr.clientWidth / 2, best = 0, bd = 1e9;
        items.forEach(function (it, k) { var c = it.offsetLeft + it.offsetWidth / 2, d = Math.abs(c - mid); if (d < bd) { bd = d; best = k; } });
        setCur(best);
      });
    }, { passive: true });
    prev.addEventListener('click', function () { go(cur - 1); });
    next.addEventListener('click', function () { go(cur + 1); });
    setCur(0);
    var lb = $('#lb'), lbImg = lb.querySelector('img'), lbI = 0;
    function show(i) { lbI = (i + items.length) % items.length; var im = items[lbI].querySelector('img'); lbImg.src = im.currentSrc || im.src; lb.querySelector('.cnt').textContent = dg(lbI + 1) + ' / ' + dg(items.length); }
    function openLb(i) { show(i); lb.classList.add('on'); root.style.overflow = 'hidden'; }
    function closeLb() { lb.classList.remove('on'); root.style.overflow = ''; }
    lb.querySelector('.x').addEventListener('click', closeLb);
    lb.querySelector('.pv').addEventListener('click', function (e) { e.stopPropagation(); show(lbI - 1); });
    lb.querySelector('.nx').addEventListener('click', function (e) { e.stopPropagation(); show(lbI + 1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
    var sx = 0;
    lb.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', function (e) { var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 45) show(lbI + (dx < 0 ? 1 : -1)); }, { passive: true });
    document.addEventListener('keydown', function (e) { if (!lb.classList.contains('on')) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') show(lbI + 1); if (e.key === 'ArrowLeft') show(lbI - 1); });
  })();

  /* ---------- تأكيد الحضور (بيوصل للوحة صاحب الدعوة) ---------- */
  (function () {
    var form = $('#rsForm'); if (!form) return;
    var sec = $('#mithaq-rsvp'), msg = $('#rsMsg'), send = $('#rsSend');
    var name = $('#rsName'), note = $('#rsNote');
    var sid = C.shortId || '';
    var SENT_KEY = 'mithaq_rsvp_' + (sid || 'preview');
    var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
    var att = null, btns = $$('.ch button', form);
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        att = b.getAttribute('data-a') === 'yes';
        btns.forEach(function (x) { var on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on ? 'true' : 'false'); });
        msg.textContent = '';
      });
    });
    function done() { sec.classList.add('sent'); }
    // في المحرر: رسالة الشكر ظاهرة تحت الفورم عشان تتعدّل
    if (EDIT) sec.classList.add('gc-show-done');
    if (!STATIC && sid && store.get(SENT_KEY)) done();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (EDIT) return;
      var n = name.value.trim().replace(/\s+/g, ' ');
      if (n.length < 2) { msg.textContent = AR ? 'من فضلك اكتب اسمك.' : 'Please write your name.'; name.focus(); return; }
      if (att === null) { msg.textContent = AR ? 'من فضلك أخبرنا إن كنت ستحضر.' : 'Please let us know if you can attend.'; return; }
      if (!sid) { done(); return; }
      send.disabled = true; msg.textContent = '';
      fetch('/i/' + encodeURIComponent(sid) + '/rsvp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ guestName: n, attending: att ? 'yes' : 'no', note: $('#noteField').classList.contains('off') ? '' : note.value.trim().slice(0, 200) }) })
        .then(function (r) { if (!r.ok) throw r; store.set(SENT_KEY, '1'); store.set('mithaq_guest_name', n); done(); })
        .catch(function (r) {
          send.disabled = false;
          msg.textContent = r && r.status === 429 ? (AR ? 'محاولات كثيرة — حاول مرة أخرى بعد قليل.' : 'Too many tries — please try again in a little while.') : (AR ? 'حدث خطأ — حاول مرة أخرى.' : 'Something went wrong — please try again.');
        });
    });
  })();
})();
</script>
