    <!-- Amiri = خط العناوين العربي (Playfair Display مفيهوش حروف عربي أصلًا،

    <!--
      شبكة أمان ضد "الشاشة البيضا" بعد أي رفع جديد.

      المشكلة: أسماء ملفات /assets/ فيها بصمة المحتوى، فبتتغيّر مع كل
      رفع. متصفّح فاتح الموقع من قبل الرفع (أو عنده نسخة مخزّنة من
      الصفحة) بيفضل يطلب ملفات النسخة القديمة — واللي اتشالت. ساعتها
      مفيش أي كود بيشتغل والصفحة بتفضل بيضا فاضية من غير ولا رسالة.

      الحل: السكريبت ده عادي (مش module) فبيشتغل قبل أي حاجة. بيسمع على
      فشل تحميل أي سكريبت أو ستايل، ويعيد تحميل الصفحة من السيرفر مرة
      واحدة بس (sessionStorage بيمنع أي لفة لا نهائية). النتيجة: المستخدم
      بيشوف رفّة وترجع تشتغل، بدل ما يقعد قصاد شاشة بيضا.
    -->
    <script>
      (function () {
        var KEY = 'mithaq:asset-reload';
        var done = false;

        function recover(what) {
          if (done) return;
          done = true;
          var already = false;
          try { already = sessionStorage.getItem(KEY) === '1'; } catch (e) { /* تصفح خاص */ }
          if (already) {
            // جرّبنا مرة وفشلت — نقول للمستخدم بدل ما نفضل نلف.
            // مهم: مبنعتمدش على DOMContentLoaded هنا — لو الفشل ده
            // (زي ستايل متأخر) وصل بعد ما الحدث ده فات أصلًا، الـ
            // listener عمره ما هيتنفّذ والصفحة هتفضل بيضا فاضية تمامًا
            // من غير رسالة ولا زرار. بنتأكد من حالة المستند بدل الاعتماد
            // على حدث ممكن يكون فات.
            var render = function () {
              document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;'
                + 'display:flex;min-height:100vh;align-items:center;justify-content:center;'
                + 'text-align:center;padding:24px;color:#0f1d18">'
                + '<div><p style="font-size:17px;font-weight:700;margin:0 0 8px">'
                + 'في مشكلة في تحميل الصفحة</p>'
                + '<p style="color:#5c6b64;margin:0 0 18px;font-size:14px">'
                + 'جرّب تقفل الصفحة وتفتحها تاني، أو امسح بيانات الموقع من المتصفح.</p>'
                + '<button onclick="location.reload(true)" style="background:#0f1d18;color:#faf5ec;'
                + 'border:0;border-radius:999px;padding:11px 26px;font-size:14px;font-weight:700;'
                + 'cursor:pointer">حاول تاني</button></div></div>';
            };
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', render);
            } else {
              render();
            }
            return;
          }
          try { sessionStorage.setItem(KEY, '1'); } catch (e) { /* */ }
          // كسر الكاش: بارامتر بيخلي المتصفح يجيب الصفحة من السيرفر
          var u = location.href.split('#')[0];
          location.replace(u + (u.indexOf('?') === -1 ? '?' : '&') + '_r=' + Date.now());
        }

        /**
         * الملف ده بتاعنا ومن ملفات البناء؟
         *
         * مهم جدًا نفرّق: لو خطوط جوجل (أو أي ملف خارجي) فشلت — وده
         * بيحصل عادي في سفاري وفي شبكات كتير — الصفحة شغالة تمام
         * بخط النظام، وإعادة تحميلها غلط صريح: بتقطع التحميل وبتبان
         * للعميل كأنه اتطرد. إعادة التحميل ليها سبب واحد بس: ملف من
         * ملفات بنائنا إحنا اختفى بعد رفع نسخة جديدة.
         */
        function isOurAsset(el) {
          var src = el.src || el.href || '';
          if (!src) return false;
          try {
            var u = new URL(src, location.href);
            return u.origin === location.origin && u.pathname.indexOf('/assets/') === 0;
          } catch (e) { return false; }
        }

        // فشل تحميل ملف (سكريبت/ستايل) — بيتبلّغ في مرحلة الالتقاط بس
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (!el || !el.tagName) return;
          var tag = el.tagName.toUpperCase();
          if ((tag === 'SCRIPT' || tag === 'LINK') && isOurAsset(el)) recover(tag);
        }, true);

        // استيراد كسول فشل (زي ملف لوحة التحكم).
        // "Failed to fetch" لوحدها مش كفاية — دي بتطلع من أي طلب شبكة
        // فاشل (رفع اتقطع، إنترنت ضعيف)، وإعادة التحميل ساعتها بتضيّع
        // شغل العميل. بندوّر على رسايل فشل الوحدات بالتحديد.
        window.addEventListener('unhandledrejection', function (e) {
          var m = e && e.reason && (e.reason.message || String(e.reason));
          if (m && /(dynamically imported module|Importing a module script failed|error loading dynamically imported module)/i.test(m)) {
            recover('chunk');
          }
        });

        // التحميل عدى بنجاح؟ نصفّر العلامة عشان الرفع الجاي يبدأ نضيف
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (document.getElementById('root') && document.getElementById('root').childElementCount) {
              try { sessionStorage.removeItem(KEY); } catch (e) { /* */ }
            }
          }, 2500);
        });
      })();
    </script>
