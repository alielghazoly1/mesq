<!DOCTYPE html>
<html lang="ar" dir="rtl" class="lock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe4d6">
<link rel="preload" as="image" href="assets/poster.webp">
<style>
html,body{margin:0;background:#efe4d6;-webkit-tap-highlight-color:transparent}
html{scroll-snap-type:y mandatory;overscroll-behavior:none}
html.lock,html.lock body{overflow:hidden;height:100%}
body{font-family:'Times New Roman',serif}
/* الشريطين فوق وتحت على الموبايلات الطويلة: نفس الخلفية مغبّشة */
.bands{position:fixed;inset:-30px;background:url(assets/still.webp) center/cover;filter:blur(18px) brightness(1.03);z-index:0}
/* المسرح = كادر الفيديو 720×1280 بيتصغّر على الشاشة (الكارت كله باين) */
#stage{position:fixed;left:0;top:0;width:720px;height:1280px;transform-origin:0 0;overflow:hidden;z-index:1;background:#efe4d6}
#stage .full{position:absolute;left:0;top:0;width:720px;height:1280px;object-fit:cover;display:block}
#bg{opacity:0;transition:opacity .6s ease}
#bg.on{opacity:1}
#intro{z-index:2}
#intro.off{opacity:0;transition:opacity .6s ease;pointer-events:none}
#poster{z-index:3;transition:opacity .3s ease}
#poster.off{opacity:0;pointer-events:none}
.sec{position:absolute;inset:0;z-index:4;pointer-events:none}
.el{position:absolute;display:block;opacity:0;filter:blur(7px);transform:translateY(8px);
  transition:opacity .35s ease,filter .35s ease,transform .35s ease;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.sec.on .el{opacity:1;filter:blur(0);transform:none;transition:opacity 1s ease,filter 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.el.mono{filter:none;transform:none;clip-path:inset(0 0 100% 0)}
.sec.on .el.mono{clip-path:inset(0 0 0 0);transition:opacity .6s ease,clip-path 2s cubic-bezier(.45,.05,.3,1);transition-delay:var(--d,0s)}
.el.names{filter:none;transform:none;clip-path:inset(0 0 0 100%)}
.sec.on .el.names{clip-path:inset(0 0 0 0);transition:opacity .5s ease,clip-path 2.2s cubic-bezier(.45,.05,.3,1);transition-delay:var(--d,0s)}
a.map{position:absolute;display:block;pointer-events:auto;z-index:6;cursor:pointer}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(160,110,80,.55);pointer-events:none;opacity:0;z-index:5}
.sec.on .ring{animation:ring 2.2s ease-out 2.4s infinite}
@keyframes ring{0%{transform:scale(.7);opacity:.85}100%{transform:scale(1.35);opacity:0}}
/* لمعة دهبي حوالين الأسامي (زي الفيديو) */
.spk{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff6df 0%,rgba(240,200,140,.9) 35%,rgba(240,200,140,0) 70%);opacity:0;pointer-events:none}
.sec.on .spk{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1.15)}}
/* الغلاف: "اضغط لفتح الدعوة" */
#tap{position:absolute;left:50%;top:1085px;z-index:8;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 34px;border-radius:50px;
  background:radial-gradient(closest-side,rgba(255,250,244,.9),rgba(255,250,244,0));color:#7a5a44;font:30px 'Times New Roman',serif;white-space:nowrap;animation:pulse 2.4s ease-in-out infinite;pointer-events:none}
#tap svg{width:42px;height:42px;stroke:#8a6650;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#tap.off{opacity:0;animation:none;transition:opacity .4s}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
#cover{position:fixed;inset:0;z-index:20;cursor:pointer}
#cover.off{display:none}
/* "اسحب للأسفل" تحت الكارت */
#hint{position:absolute;left:50%;top:1112px;z-index:7;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;color:#7a5a44;font:26px 'Times New Roman',serif;
  opacity:0;transition:opacity .8s ease;pointer-events:none;text-shadow:0 0 12px rgba(255,250,244,.9)}
#hint.on{opacity:1}
#hint svg{width:30px;height:18px;stroke:#7a5a44;fill:none;stroke-width:2;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-3px);opacity:.5}50%{transform:translateY(4px);opacity:1}}
/* صفحات السكرول (فاضية — الكلام على المسرح الثابت) */
.snap{height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;z-index:2}
#mute{position:fixed;z-index:30;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:50%;border:0;padding:0;display:none;place-items:center;
  background:rgba(255,250,244,.85);box-shadow:0 4px 14px -6px rgba(80,55,40,.5);cursor:pointer}
#mute.on{display:grid}
#mute svg{width:19px;height:19px;stroke:#7a5a44;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#mute .off-i{display:none}#mute.muted .on-i{display:none}#mute.muted .off-i{display:block}
</style>
</head>
<body>
<div class="bands" aria-hidden="true"></div>
<div id="stage">
  <img class="full" src="assets/still.webp" alt="" aria-hidden="true">
  <video id="bg" class="full" src="assets/bg.mp4" muted loop playsinline webkit-playsinline preload="auto"></video>
  <video id="intro" class="full" src="assets/intro.mp4" muted playsinline webkit-playsinline preload="auto" poster="assets/poster.webp"></video>
  <img id="poster" class="full" src="assets/poster.webp" alt="" draggable="false">
  <div id="secs"></div>
  <div id="tap"><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.9-2.5L5 15.6a1.6 1.6 0 0 1 2.4-2.1L9 15"/></svg><span>اضغط لفتح الدعوة</span></div>
  <div id="hint"><span>اسحب للأسفل</span><svg viewBox="0 0 24 14"><path d="M2 2l10 10L22 2"/></svg></div>
</div>
<div id="pages"></div>
<div id="cover" role="button" tabindex="0" aria-label="افتح الدعوة"></div>
<button id="mute" type="button" aria-label="الصوت">
  <svg class="on-i" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="off-i" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/></svg>
</button>
<audio id="music" src="assets/music.m4a" loop preload="auto"></audio>
<script>
__ELEMENTS__
(function () {
  var MAP = 'https://maps.app.goo.gl/7v59yV5ovAHuSWdr7';
  var ASSET = __ASSETS__;
  var N = 7, root = document.documentElement;
  var stage = document.getElementById('stage'), secsBox = document.getElementById('secs'), pages = document.getElementById('pages');
  var intro = document.getElementById('intro'), bg = document.getElementById('bg'), poster = document.getElementById('poster');
  var tap = document.getElementById('tap'), cover = document.getElementById('cover'), hint = document.getElementById('hint');
  var music = document.getElementById('music'), mute = document.getElementById('mute');
  // المسرح: الكارت كله باين (ممكن يتقص من الجنبين لحد 25 بكسل فيديو بس)
  function fit() {
    var w = innerWidth, h = innerHeight, k = Math.min(w / 670, h / 1280);
    stage.style.transform = 'translate(' + ((w - 720 * k) / 2) + 'px,' + ((h - 1280 * k) / 2) + 'px) scale(' + k + ')';
  }
  fit(); addEventListener('resize', fit);
  // المشاهد
  var secs = [];
  for (var s = 1; s <= N; s++) {
    var d = document.createElement('div'); d.className = 'sec'; d.setAttribute('data-s', s); secsBox.appendChild(d); secs.push(d);
    var pg = document.createElement('section'); pg.className = 'snap'; pages.appendChild(pg);
  }
  var order = {}, count = {};
  EL.forEach(function (e) { count[e.s] = (count[e.s] || 0) + 1; });
  EL.forEach(function (e) {
    var sec = secs[e.s - 1], i = (order[e.s] = (order[e.s] || 0) + 1) - 1;
    var img = document.createElement('img'); img.src = ASSET[e.src]; img.alt = ''; img.draggable = false;
    img.className = 'el' + (e.k === 'mono' || e.k === 'names' ? ' ' + e.k : '');
    img.style.cssText = 'left:' + e.x + 'px;top:' + e.y + 'px;width:' + e.w + 'px;height:' + e.h + 'px;transition-delay:' + (0.25 + i * 0.42).toFixed(2) + 's';
    sec.appendChild(img);
    if (e.k === 'pin') {
      var a = document.createElement('a'); a.className = 'map'; a.href = MAP; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', 'الموقع على الخريطة');
      a.style.cssText = 'left:' + (e.x - 14) + 'px;top:' + (e.y - 14) + 'px;width:' + (e.w + 28) + 'px;height:' + (e.h + 28) + 'px';
      sec.appendChild(a);
      if (e.src === 'icon_pin') {
        var r = document.createElement('div'); r.className = 'ring';
        var sz = Math.max(e.w, e.h) + 24; r.style.cssText = 'left:' + (e.x + e.w / 2 - sz / 2) + 'px;top:' + (e.y + e.h / 2 - sz / 2) + 'px;width:' + sz + 'px;height:' + sz + 'px';
        sec.appendChild(r);
      }
    }
  });
  // لمعة حوالين الأسامي (المشهد 4)
  [[150, 720], [210, 800], [300, 700], [420, 815], [520, 710], [575, 790], [250, 760], [470, 760], [360, 690], [380, 835]].forEach(function (p, i) {
    var k = document.createElement('i'); k.className = 'spk';
    k.style.cssText = 'left:' + p[0] + 'px;top:' + p[1] + 'px;animation-delay:' + (2.2 + i * 0.27).toFixed(2) + 's;transform:scale(' + (0.7 + (i % 3) * 0.3) + ')';
    secs[3].appendChild(k);
  });
  // المشهد الظاهر = الصفحة اللي في الشاشة
  var cur = -1, ready = false;
  function show(i) {
    if (i === cur) return; cur = i;
    secs.forEach(function (sc, j) { sc.classList.toggle('on', j === i); });
    if (i > 0) hint.classList.remove('on');
  }
  function onScroll() { if (!ready) return; show(Math.max(0, Math.min(N - 1, Math.round(scrollY / innerHeight)))); }
  addEventListener('scroll', onScroll, { passive: true });
  // الفتح
  var started = false, opened = false;
  function openCard() {
    if (opened) return; opened = true;
    bg.classList.add('on'); try { bg.play().catch(function () {}); } catch (e) {}
    intro.classList.add('off');
    root.classList.remove('lock'); ready = true; scrollTo(0, 0); show(0);
    setTimeout(function () { if (cur === 0) hint.classList.add('on'); }, 4200);
  }
  function start() {
    if (started) return; started = true;
    tap.classList.add('off'); cover.classList.add('off');
    try { music.currentTime = 0; } catch (e) {}
    var pm = music.play(); if (pm && pm.catch) pm.catch(function () { mute.classList.add('muted'); });
    mute.classList.add('on');
    var p = intro.play();
    if (p && p.catch) p.catch(function () { poster.classList.add('off'); openCard(); });
    setTimeout(function () { if (!opened && intro.currentTime < 0.05) { poster.classList.add('off'); openCard(); } }, 7000);
    // الخلفية بتجهز وهي مخفية عشان تبدأ على طول
    try { bg.play().then(function () { if (!opened) { bg.pause(); bg.currentTime = 0; } }).catch(function () {}); } catch (e) {}
  }
  intro.addEventListener('timeupdate', function () { if (intro.currentTime > 0.05) poster.classList.add('off'); if (intro.duration && intro.duration - intro.currentTime < 0.35) openCard(); });
  intro.addEventListener('ended', openCard);
  intro.addEventListener('error', function () { if (started) { poster.classList.add('off'); openCard(); } });
  cover.addEventListener('click', start);
  cover.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } });
  mute.addEventListener('click', function () {
    if (music.paused) { music.muted = false; music.play().catch(function () {}); mute.classList.remove('muted'); return; }
    music.muted = !music.muted; mute.classList.toggle('muted', music.muted);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (!music.paused) { music.pause(); music.__h = 1; } }
    else if (music.__h) { music.__h = 0; music.play().catch(function () {}); }
  });
})();
</script>
</body>
</html>
